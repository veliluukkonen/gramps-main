version: '3.8'

services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    image: ghcr.io/veliluukkonen/gramps-django:latest
    restart: always
    depends_on:
      - db
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      DJANGO_DEBUG: ${DJANGO_DEBUG}
    volumes:
      - django_media:/app/media
      - django_static:/app/static

  frontend:
    image: ghcr.io/veliluukkonen/gramps-web:latest
    restart: always
    depends_on:
      - backend
    environment:
      - NAME_SERVER=127.0.0.11
      - API_HOST=http://backend:8000

  caddy:
    image: caddy:latest
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /home/veli/gramps-main/caddy/Caddyfile:/etc/caddy/Caddyfile 
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - frontend

volumes:
  pgdata:
  django_media:
  django_static:
  caddy_data:
  caddy_config: